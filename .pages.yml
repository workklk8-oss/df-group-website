          - { name: buttonLabel, label: 按钮文字, type: string }
          - { name: buttonLink, label: 按钮链接, type: string }

      - name: galleryPage
        label: 图库页文字
        type: object
        fields:
          - { name: eyebrow, label: 小标题, type: string }
          - { name: heading, label: 页面标题, type: string }
          - { name: lede, label: 引言段落, type: text }
